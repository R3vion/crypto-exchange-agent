services:
  qdrant-restore:
    image: alpine:latest
    volumes:
      - ./data/qdrant-storage.tar.gz:/backup/qdrant-storage.tar.gz:ro
      - qdrant_data:/qdrant/storage
    command: >
      sh -c "
        rm -rf /qdrant/storage/* &&
        tar xzf /backup/qdrant-storage.tar.gz -C /qdrant/storage
      "

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
      - "127.0.0.1:6332:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app
    depends_on:
      qdrant-restore:
        condition: service_completed_successfully

  streamlit:
    build: .
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:80:8501"
    networks:
      - app
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    env_file:
      - ".env.prod"
     

volumes:
  qdrant_data:

networks:
  app:
