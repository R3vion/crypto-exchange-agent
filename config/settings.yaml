project:
  name: crypto-exchange-risk-agent
  version: "0.1.0"

llm:
  provider: ollama
  model: qwen3.6:27B
  temperature: 0

vector_store:
  provider: qdrant
  collection: crypto_exchange_documents

database:
  path: data/structured/financial_data.db

retrieval:
  top_k: 5
  score_threshold: 0.5

agent:
  max_iterations: 3

exchanges:
  - bitpanda
  - coinbase
  - binance
  - kraken
  - coincash